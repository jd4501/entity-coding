<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document synthetic-3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #fafafa;
        }
        #main-container {
            display: flex;
            height: 100vh;
        }
        #main-text {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        #main-text h1 {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            z-index: 1;
        }
        #text-content {
            padding: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            flex: 1;
        }
        #side-bar {
            width: 300px;
            overflow-y: auto;
            border-left: 1px solid #e0e0e0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .highlight {
            background-color: #fff59d;
        }
        h2 {
            font-size: 18px;
            color: #424242;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .code-list {
            list-style-type: none;
            padding: 0;
        }
        .code-list li {
            margin-bottom: 10px;
        }
        .code-list label {
            margin-left: 5px;
            cursor: pointer;
            font-size: 16px;
            color: #616161;
        }
        input[type="radio"] {
            cursor: pointer;
        }
        strong {
            font-weight: bold;
        }
        #thresholds {
            margin-bottom: 20px;
        }
        #thresholds label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #424242;
        }
        #thresholds input[type="range"] {
            width: 100%;
        }
        .threshold-value {
            font-weight: bold;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="main-text">
            <h1>Document synthetic-3</h1>
            <div id="text-content"></div>
        </div>
        <div id="side-bar">
            <h2>Predicted Codes</h2>
                <div id="thresholds">
                    <label for="code-threshold">
                        Code Prediction Confidence (&ge; <span id="code-threshold-value" class="threshold-value"></span>)
                    </label>
                    <input type="range" id="code-threshold" min="0.4" max="1" step="0.01" value="0.7">

                    <label for="evidence-threshold">
                        Evidence Confidence (&ge; <span id="evidence-threshold-value" class="threshold-value"></span>)
                    </label>
                    <input type="range" id="evidence-threshold" min="0.0" max="0.02" step="0.001" value="0.01">
                </div>
            <form>
                <ul class="code-list" id="code-list">
                    <!-- Code items will be dynamically populated -->
                </ul>
            </form>
        </div>
    </div>
    <script>
        var evidence_spans_data = {"E78.5": {"probability": 0.9404008, "formatted_code": "E78.5", "long_title": "Hyperlipidemia, unspecified", "code_type": "diagnosis", "code_version": "10", "evidence_spans": [{"span": [159, 184], "attribution": 0.206192849582294}, {"span": [2212, 2226], "attribution": 0.06608598469756544}, {"span": [191, 219], "attribution": 0.011950994885410182}, {"span": [239, 323], "attribution": 0.0008820024959277362}, {"span": [2228, 2248], "attribution": 0.0008208203726098873}, {"span": [1464, 1503], "attribution": 0.0006859791174065322}, {"span": [1605, 1633], "attribution": 0.0006821600836701691}, {"span": [367, 403], "attribution": 0.0003210470895282924}, {"span": [56, 65], "attribution": 0.00025933803408406675}, {"span": [656, 663], "attribution": 0.00023945842258399352}, {"span": [41, 51], "attribution": 0.0001933878957061097}, {"span": [340, 349], "attribution": 0.00017598328122403473}, {"span": [1306, 1314], "attribution": 0.00016955990577116609}, {"span": [603, 623], "attribution": 0.00014474836643785238}, {"span": [2201, 2209], "attribution": 0.00013466013479046524}, {"span": [1248, 1288], "attribution": 0.00011013005132554099}]}, "F17.210": {"probability": 0.68664867, "formatted_code": "F17.210", "long_title": "Nicotine dependence, cigarettes, uncomplicated", "code_type": "diagnosis", "code_version": "10", "evidence_spans": [{"span": [2228, 2248], "attribution": 0.33690614718943834}, {"span": [191, 219], "attribution": 0.11216956586576998}, {"span": [1605, 1633], "attribution": 0.002616856712847948}, {"span": [367, 403], "attribution": 0.00068631352041848}, {"span": [159, 184], "attribution": 0.000410583452321589}, {"span": [2212, 2226], "attribution": 0.00020672603568527848}, {"span": [656, 663], "attribution": 0.00011243949120398611}, {"span": [2159, 2201], "attribution": 0.00010969420691253617}]}};
        var originalText = "<u><strong>Chief Complaint:<\/strong><\/u>\nChest pain and dizziness\n<u><strong>History of Present Illness:<\/strong><\/u>\nThe patient is a 52-year-old male with a history of hyperlipidemia and a 20-pack-year smoking history who presented with sudden-onset substernal chest pain, described as tight and radiating to the left arm, accompanied by dizziness and diaphoresis.\nSymptoms began while walking his dog and lasted approximately 20 minutes.\nThe pain resolved upon arrival at the emergency department.\nNo history of recent illness, trauma, or significant physical exertion prior to the event.\n<u><strong>Physical Examination:<\/strong><\/u>\nGeneral: Appeared anxious but in no acute distress.\nVitals:\nTemperature: 97.9\u00b0F\nHeart Rate: 78 bpm\nBlood Pressure: 132/84 mmHg\nRespiratory Rate: 16 bpm\nSpO2: 98% on room air\nCardiovascular: Normal heart sounds, no murmurs or gallops.\nLungs: Clear to auscultation bilaterally.\nExtremities: No edema, pulses symmetric.\nOther: Normal neurological exam.\nPertinent Results\nBlood Tests (Performed 11/19/2024):\nTroponin I: 0.08 ng/mL (Normal: <0.04; mildly elevated)\nLipid Panel:\nTotal Cholesterol: 220 mg/dL (\u2191)\nLDL: 150 mg/dL (\u2191)\nHDL: 40 mg/dL\nTriglycerides: 180 mg/dL\nCBC and CMP: Normal.\nElectrocardiogram (ECG):\nST-segment depression in leads V5 and V6, consistent with ischemia.\n<u><strong>Imaging:<\/strong><\/u>\nChest X-ray: Normal cardiac silhouette, no pulmonary abnormalities.\nCardiac Stress Test (11/20/2024):\nPositive for inducible ischemia in the inferior wall.\n<u><strong>Brief Hospital Course:<\/strong><\/u>\nThe patient was admitted for evaluation of suspected acute coronary syndrome (ACS).\nInitial management included aspirin 325 mg, atorvastatin 40 mg, and sublingual nitroglycerin for symptom relief.\nSerial troponins remained stable without a significant rise, ruling out acute myocardial infarction.\nCardiology consultation recommended optimizing medical management and scheduling an outpatient coronary angiography within two weeks.\nThe patient received extensive education on the importance of smoking cessation, dietary modifications, and medication adherence.\n<u><strong>Discharge Diagnoses:<\/strong><\/u>\nNon-ST Elevation Acute Coronary Syndrome (NSTE-ACS).\nHyperlipidemia.\nTobacco use disorder.";

        var codeThresholdInput = document.getElementById('code-threshold');
        var codeThresholdValue = document.getElementById('code-threshold-value');
        var evidenceThresholdInput = document.getElementById('evidence-threshold');
        var evidenceThresholdValue = document.getElementById('evidence-threshold-value');
        var codeList = document.getElementById('code-list');
        var textContent = document.getElementById('text-content');
        var selectedCode = null;

        function updateThresholdValues() {
            codeThresholdValue.textContent = parseFloat(codeThresholdInput.value).toFixed(2);
            evidenceThresholdValue.textContent = parseFloat(evidenceThresholdInput.value).toFixed(3);
        }

        function computeFilteredSpans(data, evidenceThreshold) {
            var filtered = data.evidence_spans.filter(function(item) {
                return item.attribution >= evidenceThreshold;
            });
            if (filtered.length === 0 && data.evidence_spans.length > 0) {
                // Predictions are pre-sorted by descending attribution, so the
                // top-attribution span is always the first element.
                filtered = [data.evidence_spans[0]];
            }
            return filtered;
        }

        function filterCodes() {
            var codeThreshold = parseFloat(codeThresholdInput.value);
            var evidenceThreshold = parseFloat(evidenceThresholdInput.value);
            var prevSelectedCode = selectedCode;

            codeList.innerHTML = '';

            Object.keys(evidence_spans_data).forEach(function(code) {
                var data = evidence_spans_data[code];
                if (data.probability < codeThreshold) {
                    return;
                }
                var filteredSpans = computeFilteredSpans(data, evidenceThreshold);
                if (filteredSpans.length === 0) {
                    return;
                }
                data.filtered_spans = filteredSpans;

                var listItem = document.createElement('li');
                var radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.name = 'code';
                radioInput.value = code;
                radioInput.id = 'code_' + code;
                if (code === prevSelectedCode) {
                    radioInput.checked = true;
                }
                radioInput.addEventListener('change', function() {
                    if (this.checked) {
                        onCodeSelected(this.value);
                    }
                });
                var label = document.createElement('label');
                label.htmlFor = 'code_' + code;
                var codeTypeLabel = data.code_type === 'diagnosis'
                    ? '[Dx]'
                    : (data.code_type === 'procedure' ? '[Px]' : '[?]');
                label.innerHTML = codeTypeLabel + ' <strong>' + data.formatted_code + '</strong>: ' + data.long_title;
                listItem.appendChild(radioInput);
                listItem.appendChild(label);
                codeList.appendChild(listItem);
            });

            if (prevSelectedCode && evidence_spans_data[prevSelectedCode] && evidence_spans_data[prevSelectedCode].filtered_spans) {
                selectedCode = prevSelectedCode;
                highlightSelectedCode();
            } else {
                selectedCode = null;
                textContent.innerHTML = originalText;
            }
        }

        function highlightText(spans) {
            var result = [];
            var last_index = 0;
            spans.sort(function(a, b) { return a[0] - b[0]; });
            for (var i = 0; i < spans.length; i++) {
                var start = spans[i][0];
                var end = spans[i][1];
                if (start > last_index) {
                    result.push(originalText.substring(last_index, start));
                }
                result.push('<span class="highlight">' + originalText.substring(start, end) + '</span>');
                last_index = end;
            }
            if (last_index < originalText.length) {
                result.push(originalText.substring(last_index));
            }
            textContent.innerHTML = result.join('');
        }

        function onCodeSelected(code) {
            selectedCode = code;
            highlightSelectedCode();
        }

        function highlightSelectedCode() {
            var data = evidence_spans_data[selectedCode];
            if (data && data.filtered_spans) {
                var spans = data.filtered_spans.map(function(item) { return item.span; });
                highlightText(spans);
            } else {
                textContent.innerHTML = originalText;
            }
        }

        codeThresholdInput.addEventListener('input', function() {
            updateThresholdValues();
            filterCodes();
        });

        evidenceThresholdInput.addEventListener('input', function() {
            updateThresholdValues();
            var evidenceThreshold = parseFloat(evidenceThresholdInput.value);
            var codeThreshold = parseFloat(codeThresholdInput.value);
            Object.keys(evidence_spans_data).forEach(function(code) {
                var data = evidence_spans_data[code];
                if (data.probability >= codeThreshold) {
                    data.filtered_spans = computeFilteredSpans(data, evidenceThreshold);
                }
            });
            if (selectedCode) {
                highlightSelectedCode();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            updateThresholdValues();
            textContent.innerHTML = originalText;
            filterCodes();
        });
    </script>
</body>
</html>
