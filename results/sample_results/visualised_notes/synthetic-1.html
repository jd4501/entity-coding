<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document synthetic-1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #fafafa;
        }
        #main-container {
            display: flex;
            height: 100vh;
        }
        #main-text {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        #main-text h1 {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            z-index: 1;
        }
        #text-content {
            padding: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            flex: 1;
        }
        #side-bar {
            width: 300px;
            overflow-y: auto;
            border-left: 1px solid #e0e0e0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .highlight {
            background-color: #fff59d;
        }
        h2 {
            font-size: 18px;
            color: #424242;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .code-list {
            list-style-type: none;
            padding: 0;
        }
        .code-list li {
            margin-bottom: 10px;
        }
        .code-list label {
            margin-left: 5px;
            cursor: pointer;
            font-size: 16px;
            color: #616161;
        }
        input[type="radio"] {
            cursor: pointer;
        }
        strong {
            font-weight: bold;
        }
        #thresholds {
            margin-bottom: 20px;
        }
        #thresholds label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #424242;
        }
        #thresholds input[type="range"] {
            width: 100%;
        }
        .threshold-value {
            font-weight: bold;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="main-text">
            <h1>Document synthetic-1</h1>
            <div id="text-content"></div>
        </div>
        <div id="side-bar">
            <h2>Predicted Codes</h2>
                <div id="thresholds">
                    <label for="code-threshold">
                        Code Prediction Confidence (&ge; <span id="code-threshold-value" class="threshold-value"></span>)
                    </label>
                    <input type="range" id="code-threshold" min="0.4" max="1" step="0.01" value="0.7">

                    <label for="evidence-threshold">
                        Evidence Confidence (&ge; <span id="evidence-threshold-value" class="threshold-value"></span>)
                    </label>
                    <input type="range" id="evidence-threshold" min="0.0" max="0.02" step="0.001" value="0.01">
                </div>
            <form>
                <ul class="code-list" id="code-list">
                    <!-- Code items will be dynamically populated -->
                </ul>
            </form>
        </div>
    </div>
    <script>
        var evidence_spans_data = {"I10": {"probability": 0.97825056, "formatted_code": "I10", "long_title": "Essential (primary) hypertension", "code_type": "diagnosis", "code_version": "10", "evidence_spans": [{"span": [2266, 2278], "attribution": 0.12714152038097382}, {"span": [2679, 2703], "attribution": 0.03224582471011672}, {"span": [168, 191], "attribution": 0.031860886738286354}, {"span": [2280, 2313], "attribution": 0.0014579574635718018}, {"span": [196, 200], "attribution": 0.001439377898350358}, {"span": [2607, 2619], "attribution": 0.0006417323020286858}, {"span": [2313, 2317], "attribution": 0.000498359848279506}, {"span": [336, 344], "attribution": 0.00010026556992670521}]}, "K21.9": {"probability": 0.970829, "formatted_code": "K21.9", "long_title": "Gastro-esophageal reflux disease without esophagitis", "code_type": "diagnosis", "code_version": "10", "evidence_spans": [{"span": [2280, 2313], "attribution": 0.150087172514759}, {"span": [2313, 2317], "attribution": 0.05752716679126024}, {"span": [196, 200], "attribution": 0.04030235297977924}, {"span": [2607, 2619], "attribution": 0.00037787311885040253}, {"span": [2266, 2278], "attribution": 0.00013626417785417289}]}, "K85.20": {"probability": 0.6015034, "formatted_code": "K85.20", "long_title": "Alcohol induced acute pancreatitis without necrosis or infection", "code_type": "diagnosis", "code_version": "10", "evidence_spans": [{"span": [2213, 2264], "attribution": 0.24734624259872362}, {"span": [1524, 1575], "attribution": 0.0593635237091803}, {"span": [1365, 1383], "attribution": 0.005257666081888601}, {"span": [2581, 2592], "attribution": 0.0003342888521729037}, {"span": [1459, 1480], "attribution": 0.00020725000649690628}, {"span": [1824, 1857], "attribution": 0.00012775746290571988}]}};
        var originalText = "<u><strong>Chief Complaint:<\/strong><\/u>\nSevere abdominal pain and nausea.\n<u><strong>History of Present Illness:<\/strong><\/u>\nThe patient is a 38-year-old male with a history of hypertension and GERD who presented with a 3-day history of worsening epigastric abdominal pain radiating to the back, associated with nausea and occasional vomiting.\nThe pain was described as sharp, 8/10 in intensity, and worsened with food intake.\nNo fever, diarrhea, or urinary symptoms were reported.\n<u><strong>Physical Examination:<\/strong><\/u>\nGeneral: Alert, in moderate distress due to pain.\nVitals:\nTemperature: 98.7\u00b0F\nHeart Rate: 92 bpm\nBlood Pressure: 140/88 mmHg\nRespiratory Rate: 18 bpm\nSpO2: 98% on room air\nAbdomen: Tenderness in the epigastric region without rebound or guarding; normal bowel sounds.\nOther: Normal cardiovascular, respiratory, and neurological examinations.\nPertinent Results\nBlood Tests (Performed 11/17/2024):\nComplete Blood Count (CBC):\nWBC: 14,000/mm\u00b3 (\u2191)\nHemoglobin: 14.2 g/dL\nPlatelets: 250,000/mm\u00b3\nComprehensive Metabolic Panel (CMP):\nSodium: 139 mmol/L\nPotassium: 4.1 mmol/L\nChloride: 101 mmol/L\nBUN: 25 mg/dL (\u2191)\nCreatinine: 1.2 mg/dL\nAST: 150 U/L (\u2191)\nALT: 200 U/L (\u2191)\nAlkaline Phosphatase: 110 U/L\nLipase: 350 U/L (\u2191)\nOther: Negative serum H.\npylori antibody test.\n<u><strong>Imaging:<\/strong><\/u>\nAbdominal CT Scan (11/18/2024): Evidence of acute pancreatitis without complications such as necrosis or pseudocyst formation.\n<u><strong>Brief Hospital Course:<\/strong><\/u>\nThe patient was admitted for acute pancreatitis, likely secondary to alcohol use.\nHe was managed with intravenous fluids, pain control using acetaminophen and low-dose morphine, and antiemetics.\nA low-fat, clear liquid diet was initiated on hospital day 3 and gradually advanced as tolerated.\nLaboratory abnormalities, including elevated liver enzymes and lipase, improved over the hospital stay.\nHe was closely monitored for complications, none of which developed.\nPatient education included strict abstinence from alcohol, a low-fat diet, and follow-up with primary care and gastroenterology.\nA prescription for pantoprazole 40 mg daily was provided for GERD management.\n<u><strong>Discharge Diagnoses:<\/strong><\/u>\nAcute pancreatitis, likely secondary to alcohol use.\nHypertension.\nGastroesophageal reflux disease (GERD).\n<u><strong>Discharge Instructions:<\/strong><\/u>\nPrimary Care Visit: Schedule within 1 week of discharge.\nGastroenterology: Follow-up in 2 weeks to reassess liver enzymes and discuss long-term management.\nDiet: Low-fat diet; avoid alcohol completely.\n<u><strong>Medications:<\/strong><\/u>\nPantoprazole 40 mg daily\nAcetaminophen as needed for mild pain\nContinue antihypertensive regimen as prescribed.";

        var codeThresholdInput = document.getElementById('code-threshold');
        var codeThresholdValue = document.getElementById('code-threshold-value');
        var evidenceThresholdInput = document.getElementById('evidence-threshold');
        var evidenceThresholdValue = document.getElementById('evidence-threshold-value');
        var codeList = document.getElementById('code-list');
        var textContent = document.getElementById('text-content');
        var selectedCode = null;

        function updateThresholdValues() {
            codeThresholdValue.textContent = parseFloat(codeThresholdInput.value).toFixed(2);
            evidenceThresholdValue.textContent = parseFloat(evidenceThresholdInput.value).toFixed(3);
        }

        function computeFilteredSpans(data, evidenceThreshold) {
            var filtered = data.evidence_spans.filter(function(item) {
                return item.attribution >= evidenceThreshold;
            });
            if (filtered.length === 0 && data.evidence_spans.length > 0) {
                // Predictions are pre-sorted by descending attribution, so the
                // top-attribution span is always the first element.
                filtered = [data.evidence_spans[0]];
            }
            return filtered;
        }

        function filterCodes() {
            var codeThreshold = parseFloat(codeThresholdInput.value);
            var evidenceThreshold = parseFloat(evidenceThresholdInput.value);
            var prevSelectedCode = selectedCode;

            codeList.innerHTML = '';

            Object.keys(evidence_spans_data).forEach(function(code) {
                var data = evidence_spans_data[code];
                if (data.probability < codeThreshold) {
                    return;
                }
                var filteredSpans = computeFilteredSpans(data, evidenceThreshold);
                if (filteredSpans.length === 0) {
                    return;
                }
                data.filtered_spans = filteredSpans;

                var listItem = document.createElement('li');
                var radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.name = 'code';
                radioInput.value = code;
                radioInput.id = 'code_' + code;
                if (code === prevSelectedCode) {
                    radioInput.checked = true;
                }
                radioInput.addEventListener('change', function() {
                    if (this.checked) {
                        onCodeSelected(this.value);
                    }
                });
                var label = document.createElement('label');
                label.htmlFor = 'code_' + code;
                var codeTypeLabel = data.code_type === 'diagnosis'
                    ? '[Dx]'
                    : (data.code_type === 'procedure' ? '[Px]' : '[?]');
                label.innerHTML = codeTypeLabel + ' <strong>' + data.formatted_code + '</strong>: ' + data.long_title;
                listItem.appendChild(radioInput);
                listItem.appendChild(label);
                codeList.appendChild(listItem);
            });

            if (prevSelectedCode && evidence_spans_data[prevSelectedCode] && evidence_spans_data[prevSelectedCode].filtered_spans) {
                selectedCode = prevSelectedCode;
                highlightSelectedCode();
            } else {
                selectedCode = null;
                textContent.innerHTML = originalText;
            }
        }

        function highlightText(spans) {
            var result = [];
            var last_index = 0;
            spans.sort(function(a, b) { return a[0] - b[0]; });
            for (var i = 0; i < spans.length; i++) {
                var start = spans[i][0];
                var end = spans[i][1];
                if (start > last_index) {
                    result.push(originalText.substring(last_index, start));
                }
                result.push('<span class="highlight">' + originalText.substring(start, end) + '</span>');
                last_index = end;
            }
            if (last_index < originalText.length) {
                result.push(originalText.substring(last_index));
            }
            textContent.innerHTML = result.join('');
        }

        function onCodeSelected(code) {
            selectedCode = code;
            highlightSelectedCode();
        }

        function highlightSelectedCode() {
            var data = evidence_spans_data[selectedCode];
            if (data && data.filtered_spans) {
                var spans = data.filtered_spans.map(function(item) { return item.span; });
                highlightText(spans);
            } else {
                textContent.innerHTML = originalText;
            }
        }

        codeThresholdInput.addEventListener('input', function() {
            updateThresholdValues();
            filterCodes();
        });

        evidenceThresholdInput.addEventListener('input', function() {
            updateThresholdValues();
            var evidenceThreshold = parseFloat(evidenceThresholdInput.value);
            var codeThreshold = parseFloat(codeThresholdInput.value);
            Object.keys(evidence_spans_data).forEach(function(code) {
                var data = evidence_spans_data[code];
                if (data.probability >= codeThreshold) {
                    data.filtered_spans = computeFilteredSpans(data, evidenceThreshold);
                }
            });
            if (selectedCode) {
                highlightSelectedCode();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            updateThresholdValues();
            textContent.innerHTML = originalText;
            filterCodes();
        });
    </script>
</body>
</html>
