<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document synthetic-2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #fafafa;
        }
        #main-container {
            display: flex;
            height: 100vh;
        }
        #main-text {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        #main-text h1 {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            z-index: 1;
        }
        #text-content {
            padding: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            flex: 1;
        }
        #side-bar {
            width: 300px;
            overflow-y: auto;
            border-left: 1px solid #e0e0e0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .highlight {
            background-color: #fff59d;
        }
        h2 {
            font-size: 18px;
            color: #424242;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .code-list {
            list-style-type: none;
            padding: 0;
        }
        .code-list li {
            margin-bottom: 10px;
        }
        .code-list label {
            margin-left: 5px;
            cursor: pointer;
            font-size: 16px;
            color: #616161;
        }
        input[type="radio"] {
            cursor: pointer;
        }
        strong {
            font-weight: bold;
        }
        #thresholds {
            margin-bottom: 20px;
        }
        #thresholds label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #424242;
        }
        #thresholds input[type="range"] {
            width: 100%;
        }
        .threshold-value {
            font-weight: bold;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="main-text">
            <h1>Document synthetic-2</h1>
            <div id="text-content"></div>
        </div>
        <div id="side-bar">
            <h2>Predicted Codes</h2>
                <div id="thresholds">
                    <label for="code-threshold">
                        Code Prediction Confidence (&ge; <span id="code-threshold-value" class="threshold-value"></span>)
                    </label>
                    <input type="range" id="code-threshold" min="0.4" max="1" step="0.01" value="0.7">

                    <label for="evidence-threshold">
                        Evidence Confidence (&ge; <span id="evidence-threshold-value" class="threshold-value"></span>)
                    </label>
                    <input type="range" id="evidence-threshold" min="0.0" max="0.02" step="0.001" value="0.01">
                </div>
            <form>
                <ul class="code-list" id="code-list">
                    <!-- Code items will be dynamically populated -->
                </ul>
            </form>
        </div>
    </div>
    <script>
        var evidence_spans_data = {"J45.901": {"probability": 0.9636767, "formatted_code": "J45.901", "long_title": "Unspecified asthma with (acute) exacerbation", "code_type": "diagnosis", "code_version": "10", "evidence_spans": [{"span": [2244, 2269], "attribution": 0.10413741879165173}, {"span": [1756, 1775], "attribution": 0.08741359412670135}, {"span": [2187, 2241], "attribution": 0.008128222689265385}, {"span": [2271, 2288], "attribution": 0.007707524986471981}, {"span": [1698, 1720], "attribution": 0.0011490320321172476}, {"span": [178, 195], "attribution": 0.0003993436403106898}, {"span": [1260, 1297], "attribution": 0.00038159251562319696}, {"span": [1921, 1937], "attribution": 0.0003783497086260468}, {"span": [1726, 1735], "attribution": 0.00023903764667920768}]}, "J13": {"probability": 0.88243526, "formatted_code": "J13", "long_title": "Pneumonia due to Streptococcus pneumoniae", "code_type": "diagnosis", "code_version": "10", "evidence_spans": [{"span": [2187, 2241], "attribution": 0.22903426321863662}, {"span": [1260, 1297], "attribution": 0.015037042554467916}, {"span": [1405, 1414], "attribution": 0.0033378603984601796}, {"span": [1492, 1520], "attribution": 0.0011516011654748581}, {"span": [1698, 1720], "attribution": 0.00024328348808921874}, {"span": [2153, 2172], "attribution": 0.00022982211521593854}, {"span": [2244, 2269], "attribution": 0.00018704438116401434}, {"span": [1756, 1775], "attribution": 0.00013722707808483392}]}, "R09.02": {"probability": 0.72368366, "formatted_code": "R09.02", "long_title": "Hypoxemia", "code_type": "diagnosis", "code_version": "10", "evidence_spans": [{"span": [1525, 1539], "attribution": 0.1444352179823909}, {"span": [556, 581], "attribution": 0.0008363527012988925}, {"span": [1260, 1297], "attribution": 0.0001621533156139776}, {"span": [1492, 1520], "attribution": 0.00013301653962116688}]}};
        var originalText = "<u><strong>Chief Complaint:<\/strong><\/u>\nFever and shortness of breath for 4 days.\n<u><strong>History of Present Illness:<\/strong><\/u>\nThe patient is a 34-year-old female with a history of asthma and seasonal allergies who presented with a 4-day history of fever (maximum 101.8\u00b0F), productive cough with green sputum, and progressive shortness of breath.\nSymptoms began after recent exposure to a family member with an upper respiratory infection.\nShe denied chest pain, hemoptysis, or recent travel.\n<u><strong>Physical Examination:<\/strong><\/u>\nGeneral: Mild respiratory distress, fatigued appearance.\nVitals:\nTemperature: 100.9\u00b0F\nHeart Rate: 110 bpm\nBlood Pressure: 126/78 mmHg\nRespiratory Rate: 22 bpm\nSpO2: 93% on room air\nLungs: Diffuse wheezing and crackles in the right lower lung field.\nOther: No jugular venous distension, normal cardiovascular and neurological examinations.\nPertinent Results\nBlood Tests (Performed 11/16/2024):\nComplete Blood Count (CBC):\nWBC: 13,800/mm\u00b3 (\u2191)\nHemoglobin: 12.6 g/dL\nPlatelets: 320,000/mm\u00b3\nComprehensive Metabolic Panel (CMP):\nSodium: 137 mmol/L\nPotassium: 4.0 mmol/L\nChloride: 102 mmol/L\nBUN: 16 mg/dL\nCreatinine: 0.9 mg/dL\nInflammatory Markers:\nC-Reactive Protein (CRP): 7.2 mg/dL (\u2191)\nMicrobiology:\nSputum Culture: Positive for Streptococcus pneumoniae.\n<u><strong>Imaging:<\/strong><\/u>\nChest X-ray (11/16/2024): Right lower lobe consolidation consistent with pneumonia.\n<u><strong>Brief Hospital Course:<\/strong><\/u>\nThe patient was admitted for community-acquired pneumonia and mild hypoxemia.\nShe was started on intravenous ceftriaxone and oral azithromycin.\nSupplemental oxygen via nasal cannula at 2 L/min was initiated to maintain SpO2 above 94%. Bronchodilator therapy with albuterol was used to address asthma exacerbation.\nOver the course of her hospitalization, the patient showed significant improvement in oxygenation and respiratory symptoms.\nShe transitioned to oral antibiotics on hospital day 4 and no longer required supplemental oxygen at the time of discharge.\nShe received education on proper asthma management, pneumonia recovery, and signs of worsening respiratory symptoms.\n<u><strong>Discharge Diagnoses:<\/strong><\/u>\nCommunity-acquired pneumonia (Streptococcus pneumoniae).\nAcute asthma exacerbation.\nAllergic rhinitis.";

        var codeThresholdInput = document.getElementById('code-threshold');
        var codeThresholdValue = document.getElementById('code-threshold-value');
        var evidenceThresholdInput = document.getElementById('evidence-threshold');
        var evidenceThresholdValue = document.getElementById('evidence-threshold-value');
        var codeList = document.getElementById('code-list');
        var textContent = document.getElementById('text-content');
        var selectedCode = null;

        function updateThresholdValues() {
            codeThresholdValue.textContent = parseFloat(codeThresholdInput.value).toFixed(2);
            evidenceThresholdValue.textContent = parseFloat(evidenceThresholdInput.value).toFixed(3);
        }

        function computeFilteredSpans(data, evidenceThreshold) {
            var filtered = data.evidence_spans.filter(function(item) {
                return item.attribution >= evidenceThreshold;
            });
            if (filtered.length === 0 && data.evidence_spans.length > 0) {
                // Predictions are pre-sorted by descending attribution, so the
                // top-attribution span is always the first element.
                filtered = [data.evidence_spans[0]];
            }
            return filtered;
        }

        function filterCodes() {
            var codeThreshold = parseFloat(codeThresholdInput.value);
            var evidenceThreshold = parseFloat(evidenceThresholdInput.value);
            var prevSelectedCode = selectedCode;

            codeList.innerHTML = '';

            Object.keys(evidence_spans_data).forEach(function(code) {
                var data = evidence_spans_data[code];
                if (data.probability < codeThreshold) {
                    return;
                }
                var filteredSpans = computeFilteredSpans(data, evidenceThreshold);
                if (filteredSpans.length === 0) {
                    return;
                }
                data.filtered_spans = filteredSpans;

                var listItem = document.createElement('li');
                var radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.name = 'code';
                radioInput.value = code;
                radioInput.id = 'code_' + code;
                if (code === prevSelectedCode) {
                    radioInput.checked = true;
                }
                radioInput.addEventListener('change', function() {
                    if (this.checked) {
                        onCodeSelected(this.value);
                    }
                });
                var label = document.createElement('label');
                label.htmlFor = 'code_' + code;
                var codeTypeLabel = data.code_type === 'diagnosis'
                    ? '[Dx]'
                    : (data.code_type === 'procedure' ? '[Px]' : '[?]');
                label.innerHTML = codeTypeLabel + ' <strong>' + data.formatted_code + '</strong>: ' + data.long_title;
                listItem.appendChild(radioInput);
                listItem.appendChild(label);
                codeList.appendChild(listItem);
            });

            if (prevSelectedCode && evidence_spans_data[prevSelectedCode] && evidence_spans_data[prevSelectedCode].filtered_spans) {
                selectedCode = prevSelectedCode;
                highlightSelectedCode();
            } else {
                selectedCode = null;
                textContent.innerHTML = originalText;
            }
        }

        function highlightText(spans) {
            var result = [];
            var last_index = 0;
            spans.sort(function(a, b) { return a[0] - b[0]; });
            for (var i = 0; i < spans.length; i++) {
                var start = spans[i][0];
                var end = spans[i][1];
                if (start > last_index) {
                    result.push(originalText.substring(last_index, start));
                }
                result.push('<span class="highlight">' + originalText.substring(start, end) + '</span>');
                last_index = end;
            }
            if (last_index < originalText.length) {
                result.push(originalText.substring(last_index));
            }
            textContent.innerHTML = result.join('');
        }

        function onCodeSelected(code) {
            selectedCode = code;
            highlightSelectedCode();
        }

        function highlightSelectedCode() {
            var data = evidence_spans_data[selectedCode];
            if (data && data.filtered_spans) {
                var spans = data.filtered_spans.map(function(item) { return item.span; });
                highlightText(spans);
            } else {
                textContent.innerHTML = originalText;
            }
        }

        codeThresholdInput.addEventListener('input', function() {
            updateThresholdValues();
            filterCodes();
        });

        evidenceThresholdInput.addEventListener('input', function() {
            updateThresholdValues();
            var evidenceThreshold = parseFloat(evidenceThresholdInput.value);
            var codeThreshold = parseFloat(codeThresholdInput.value);
            Object.keys(evidence_spans_data).forEach(function(code) {
                var data = evidence_spans_data[code];
                if (data.probability >= codeThreshold) {
                    data.filtered_spans = computeFilteredSpans(data, evidenceThreshold);
                }
            });
            if (selectedCode) {
                highlightSelectedCode();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            updateThresholdValues();
            textContent.innerHTML = originalText;
            filterCodes();
        });
    </script>
</body>
</html>
