# A conda environment that consolidates dependencies from PLM-CA and our our own model training
# and inference. Allows all scripts in the codebase to be run. If issues do occur, there are likely missing
# packages from external/plm_ca/pyproject.toml.
name: entitycoding
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11.5
  - pytorch==2.1.1
  - torchvision==0.16.1
  - torchaudio==2.1.1
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pandas=2.3.0
  - scipy=1.15.2
  - scikit-learn=1.7.0
  - datasets=2.17.1
  - accelerate=1.7.0
  - pyarrow=20.0.0
  - safetensors=0.5.3
  - huggingface_hub=0.33.0
  - setuptools=69.5.1
  - nltk
  - jupyter
  - ipython
  - notebook
  - jupyterlab
  - tqdm
  - pyyaml
  - requests
  - click
  - rich
  - pytest
  - pre-commit
  - matplotlib
  - seaborn
  - plotly
  - beautifulsoup4
  - lxml
  - pillow
  - boto3
  - joblib
  - dill
  - regex

  - pip

  - pip:
      - transformers==4.38.1
      - tokenizers==0.15.2
      - pydantic==1.10.22
      - spacy==3.5.4
      - medspacy==1.2.0
      - medspacy-quickumls==3.2
      - medspacy_unqlite==0.9.6
      - PyRuSH==1.0.9
      - quicksectx==0.4.0
      - bert-score==0.3.13
      - captum==0.7.0
      - torchmetrics==1.6.1
      - pytorch_revgrad==0.2.0
      - lightning-utilities==0.11.9
      - ftfy==6.1.3
      - editdistance==0.8.1
      - poetry==1.8.4
      - poetry-core==1.9.1
      - poetry-plugin-export==1.8.0
      - ruff==0.1.8
      - polars==0.20.1
      - pyarrow-hotfix==0.6
      - conllu==4.5.3
      - bibtexparser==1.4.3
      - tsv==1.2
      - gdown==5.2.0
      - wandb==0.16.1
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - typer==0.9.4
      - terminaltables==3.1.10
      - tabulate==0.9.0
      - python-dotenv==1.0.0
      - rebiber==1.1.3
      - pybtex==0.24.0
      - latexcodec==3.0.0
      - sentencepiece==0.1.99
      - scikit-multilearn==0.2.0
